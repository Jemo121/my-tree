version: "2"

run:
  timeout: 5m
  build-tags:
    - js
    - wasm

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - revive
    - gosec
    - misspell
    - unconvert

linters-settings:
  gosec:
    excludes:
      - G103  # syscall/js requires unsafe pointer — expected in Go WASM
      - G115  # integer overflow in WASM — platform-specific
      - G404  # math/rand is correct for visual effects
  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-rules:
    # WASM main() blocks with select{} — empty block is intentional
    - path: "main\\.go"
      linters: [revive]
      text: "empty-block"
  max-issues-per-linter: 0
  max-same-issues: 0
