<div id="tree-loading" aria-live="polite">
  <span class="loading-ring" aria-hidden="true"></span>
  <p>{{ i18n "loading" }}</p>
</div>

<canvas id="tree-canvas"
  width="800"
  height="600"
  aria-label="{{ i18n "canvas_aria" (dict "Founded" .Site.Params.founded) }}">
  <p>{{ i18n "canvas_no_support" }}</p>
</canvas>

<div id="member-overlays" aria-hidden="true"></div>

<script src="/wasm_exec.js"></script>
<script>
  (function () {
    var go = new Go();
    WebAssembly.instantiateStreaming(
      fetch("{{ .Site.Params.wasm }}"),
      go.importObject
    ).then(function (r) {
      go.run(r.instance);
    }).catch(function () {
      var el = document.getElementById("tree-loading");
      if (el) { el.textContent = {{ i18n "loading_error" | jsonify }}; }
    });
  }());
</script>
