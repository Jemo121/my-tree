<div id="tree-loading" aria-live="polite">
  <span class="loading-ring" aria-hidden="true"></span>
  <p>Growing the family tree&hellip;</p>
</div>

<canvas id="tree-canvas"
  width="800"
  height="600"
  aria-label="Eguia family tree, est. {{ .Site.Params.founded }}">
  <p>Your browser does not support Canvas. Please upgrade to view the family tree.</p>
</canvas>

<div id="member-overlays" aria-hidden="true"></div>

<script src="/wasm_exec.js"></script>
<script>
  (function () {
    var go = new Go();
    WebAssembly.instantiateStreaming(
      fetch("{{ .Site.Params.wasm }}"),
      go.importObject
    ).then(function (r) {
      go.run(r.instance);
    }).catch(function () {
      var el = document.getElementById("tree-loading");
      if (el) { el.textContent = "Family tree unavailable — please try again later."; }
    });
  }());
</script>
