{{- define "main" }}
<main class="page-404" aria-labelledby="page-title">
  <div class="page-404-inner">
    <p class="page-404-leaf" aria-hidden="true">🍂</p>
    <h1 id="page-title">{{ i18n "page_not_found" }}</h1>
    <p>{{ i18n "page_not_found_desc" }}</p>
    <a href="{{ .Site.BaseURL }}" class="page-404-back">{{ i18n "page_not_found_back" }}</a>
  </div>
</main>
{{- end }}
