workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

stages:
  - security
  - validate
  - build
  - deploy

variables:
  HUGO_VERSION: "0.147.9"
  GO_VERSION: "1.23"

# ── Security ──────────────────────────────────────────────────────────────────

secrets-scan:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.18.4
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

sast:
  stage: security
  image: semgrep/semgrep:1.72.0
  script:
    - semgrep scan --config p/ci --error .gitlab-ci.yml
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

# ── Validate ──────────────────────────────────────────────────────────────────

html-validate:
  stage: validate
  image: node:22-alpine
  script:
    - npx --yes html-validate@9 "templates/**/*.html" "errors/*.html"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

size-checker:
  stage: validate
  image: alpine:3.20
  script:
    - |
      find templates errors -name '*.html' -exec wc -l {} + | awk -v warn=300 -v fail=400 '
        /total$/ { next }
        $1+0 >= fail { print "FAIL: " $2 " — " $1 " lines"; rc=1; next }
        $1+0 >= warn { print "WARN: " $2 " — " $1 " lines" }
        END { exit rc+0 }
      '
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

go-compat:
  stage: validate
  image: alpine:3.20
  script:
    - apk add --no-cache wget tar binutils
    - wget -qO /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
    - tar -xf /tmp/hugo.tar.gz -C /tmp/
    - strings /tmp/hugo > /tmp/hugo.strings
    - |
      hugo_go=$(grep -m1 '^go[0-9]' /tmp/hugo.strings | sed 's/^go//')
      echo "Hugo ${HUGO_VERSION} compiled with Go ${hugo_go} (required >= ${GO_VERSION})"
      maj_got=$(echo "${hugo_go}" | cut -d. -f1)
      min_got=$(echo "${hugo_go}" | cut -d. -f2)
      maj_req=$(echo "${GO_VERSION}" | cut -d. -f1)
      min_req=$(echo "${GO_VERSION}" | cut -d. -f2)
      fail=0
      [ "${maj_got}" -lt "${maj_req}" ] && fail=1
      [ "${maj_got}" -eq "${maj_req}" ] && [ "${min_got}" -lt "${min_req}" ] && fail=1
      if [ "$fail" -eq 1 ]; then
        echo "FAIL: Hugo ${HUGO_VERSION} uses Go ${hugo_go}, below required ${GO_VERSION}"
        exit 1
      fi
      echo "OK"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── Build ─────────────────────────────────────────────────────────────────────

# Cloudflare Pages handles deployment. This job validates the site builds without errors.
hugo-build:
  stage: build
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - hugo.toml
  before_script:
    - apk add --no-cache wget tar
    - wget -qO /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
    - tar -xf /tmp/hugo.tar.gz -C /usr/local/bin/ hugo
  script:
    - hugo --minify --logLevel warn
  artifacts:
    paths:
      - public/
    expire_in: 1 hour

# ── Deploy ────────────────────────────────────────────────────────────────────

subdomain-sync:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq wget
    - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
    - chmod +x /usr/local/bin/yq
  script:
    - |
      if [ -z "${CF_PAGES_DOMAIN}" ]; then
        echo "CF_PAGES_DOMAIN not set — skipping DNS sync (set once CF Pages is live)"
        exit 0
      fi
      yq '.[] | select(.status == "active") | .subdomain' data/family/members.yaml | while read -r subdomain; do
        fqdn="${subdomain}.eguia.me"
        count=$(curl -sf \
          "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?type=CNAME&name=${fqdn}" \
          -H "Authorization: Bearer ${CF_DNS_TOKEN}" | jq '.result | length')
        if [ "${count:-0}" -eq 0 ]; then
          echo "Creating CNAME: ${fqdn} → ${CF_PAGES_DOMAIN}"
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_DNS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"${fqdn}\",\"content\":\"${CF_PAGES_DOMAIN}\",\"ttl\":1,\"proxied\":true}" \
            | jq -r 'if .success then "Created: \(.result.name)" else "Error: \(.errors[0].message)" end'
        else
          echo "Exists: ${fqdn}"
        fi
      done
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
