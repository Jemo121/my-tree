<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:     #F8F7F4;
      --ink:    #111111;
      --muted:  #888888;
      --accent: #111111;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2rem, 6vw, 5rem);
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.4rem;
      max-width: 520px;
    }

    .code {
      font-size: clamp(5rem, 16vw, 12rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #E0DDD8;
      opacity: 0;
      animation: rise 1s cubic-bezier(0.2, 0, 0, 1) forwards 0.2s;
    }

    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.6s;
    }

    .detail {
      font-size: clamp(0.78rem, 1.2vw, 0.88rem);
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 36ch;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.9s;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-decoration: none;
      opacity: 0;
      animation: rise 0.8s ease forwards 1.2s;
      transition: opacity 0.2s ease;
      width: fit-content;
    }

    .back::before {
      content: '←';
    }

    .back:hover { opacity: 0.6; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .footer {
      font-size: 0.58rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #CCCCCC;
      opacity: 0;
      animation: rise 0.8s ease forwards 1.5s;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <span class="code" aria-hidden="true">404</span>
      <h1>Page not found</h1>
      <p class="detail">The page you're looking for doesn't exist or has been moved.</p>
      <a class="back" href="/">Back to home</a>
    </div>
    <p class="footer">emilio.eguia.me</p>
  </main>
</body>
</html>
