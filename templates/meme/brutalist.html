<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    DOMAIN VARIANTS — change the two marked blocks to switch
    Active: member.eguia.me
  -->

  <!-- member.eguia.me --> <title>Member Name</title>
  <!-- eguia.me: <title>Eguia</title> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #FFFFFF;
      --black: #000000;
      --yellow: #FFE500;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--white);
      color: var(--black);
      font-family: 'Space Mono', 'Courier New', monospace;
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 4px solid var(--black);
      margin: clamp(0.5rem, 1.5vw, 1rem);
    }

    .topbar {
      border-bottom: 4px solid var(--black);
      padding: 0.6rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--yellow);
      opacity: 0;
      animation: snap-in 0.15s ease forwards 0.1s;
    }

    @keyframes snap-in {
      to { opacity: 1; }
    }

    .topbar-text {
      font-size: clamp(0.55rem, 0.9vw, 0.65rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      gap: 0;
      position: relative;
    }

    /* Big diagonal scratch mark */
    .scratch {
      position: absolute;
      top: 0;
      right: clamp(2rem, 8vw, 6rem);
      bottom: 0;
      width: clamp(100px, 20vw, 200px);
      pointer-events: none;
      opacity: 0.06;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 11rem);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin-bottom: clamp(1rem, 2vw, 2rem);
      opacity: 0;
      animation: snap-in 0.15s ease forwards 0.2s;
    }

    h1 span {
      display: block;
      background: var(--black);
      color: var(--white);
      padding: 0 0.12em;
      width: fit-content;
    }

    .divider-block {
      width: 100%;
      height: 4px;
      background: var(--black);
      margin-bottom: clamp(0.8rem, 1.5vw, 1.4rem);
      opacity: 0;
      animation: snap-in 0.15s ease forwards 0.3s;
    }

    .status-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0;
      border: 2px solid var(--black);
      width: fit-content;
      margin-bottom: clamp(1rem, 2vw, 2rem);
      opacity: 0;
      animation: snap-in 0.15s ease forwards 0.4s;
    }

    .status-key {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border-right: 2px solid var(--black);
      background: var(--black);
      color: var(--white);
    }

    .status-val {
      font-size: 0.65rem;
      font-weight: 400;
      padding: 0.4rem 0.8rem;
    }

    .status-row + .status-row .status-key,
    .status-row + .status-row .status-val {
      border-top: 2px solid var(--black);
    }

    .cta {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      border: 2px solid var(--black);
      padding: 0.6rem 1.2rem;
      opacity: 0;
      animation: snap-in 0.15s ease forwards 0.5s;
      transition: background 0.1s, color 0.1s;
      width: fit-content;
      box-shadow: 3px 3px 0 var(--black);
    }

    .cta:hover {
      background: var(--yellow);
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    .footer {
      border-top: 4px solid var(--black);
      padding: 0.6rem 1.2rem;
      display: flex;
      justify-content: space-between;
      opacity: 0;
      animation: snap-in 0.15s ease forwards 0.6s;
    }

    .footer-text {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

  /* ---- meme ---- */
  @keyframes fade-img { from { opacity: 0 } to { opacity: 1 } }
  .meme-corner { position: fixed; bottom: clamp(2.5rem, 5vw, 4rem); right: clamp(2rem, 5vw, 4rem); width: clamp(110px, 16vw, 150px); z-index: 10; pointer-events: none; opacity: 0; animation: fade-img 0.3s ease forwards 0.8s; }
  .meme-corner svg { width: 100%; height: auto; display: block; border: 4px solid #000; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <!-- member.eguia.me -->
      <span class="topbar-text">member.eguia.me</span>
      <!-- eguia.me:
      <span class="topbar-text">eguia.me</span>
      -->
      <span class="topbar-text">⚠ Under construction</span>
    </div>

    <main class="content">
      <!-- Diagonal scratch -->
      <svg class="scratch" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="0" y1="0" x2="200" y2="400" stroke="black" stroke-width="60"/>
        <line x1="40" y1="0" x2="240" y2="400" stroke="black" stroke-width="30"/>
      </svg>

      <!-- member.eguia.me -->
      <h1>Member<span>Eguia</span></h1>
      <!-- eguia.me:
      <h1>The<span>Eguia</span>Family</h1>
      -->

      <div class="divider-block" aria-hidden="true"></div>

      <div class="status-grid">
        <div class="status-row">
          <span class="status-key">Status</span>
          <span class="status-val">Building</span>
        </div>
        <div class="status-row">
          <!-- member.eguia.me -->
          <span class="status-key">Contact</span>
          <span class="status-val">member@eguia.me</span>
          <!-- eguia.me:
          <span class="status-key">Family</span>
          <span class="status-val">Eguia</span>
          -->
        </div>
      </div>

      <a class="cta" href="mailto:member@eguia.me" aria-label="Send email">→ Get in touch</a>
    </main>

    <footer class="footer">
      <!-- member.eguia.me -->
      <span class="footer-text">© 2025 Member Name</span>
      <!-- eguia.me:
      <span class="footer-text">© 2025 Eguia</span>
      -->
      <span class="footer-text">MX</span>
    </footer>
  </div>
  <div class="meme-corner" aria-hidden="true"><svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="white"/><rect x="15" y="20" width="35" height="22" rx="2" fill="black"/><rect x="70" y="20" width="35" height="22" rx="2" fill="black"/><rect x="50" y="27" width="20" height="5" fill="black"/><rect x="4" y="27" width="11" height="4" fill="black" rx="1"/><rect x="105" y="27" width="11" height="4" fill="black" rx="1"/><rect x="20" y="23" width="8" height="3" rx="1" fill="white" opacity="0.3"/><rect x="75" y="23" width="8" height="3" rx="1" fill="white" opacity="0.3"/><text x="60" y="55" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="12" fill="#000" font-weight="900" letter-spacing="1">DEAL WITH IT</text></svg></div>
</body>
</html>
