<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    DOMAIN VARIANTS — change the two marked blocks to switch
    Active: member.eguia.me
  -->

  <!-- member.eguia.me --> <title>Member Name</title>
  <!-- eguia.me: <title>Eguia</title> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink:    #0D0D0D;
      --paper:  #F8F7F4;
      --grey:   #888;
      --border: #DDDDD8;
      --accent: #FF3F1F;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* Masthead — like a newspaper header */
    .masthead {
      border-bottom: 3px double var(--ink);
      padding: clamp(0.8rem, 2vw, 1.4rem) clamp(1.5rem, 5vw, 4rem);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      opacity: 0;
      animation: drop-in 0.7s ease forwards 0.2s;
    }

    @keyframes drop-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .masthead-date {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grey);
    }

    .masthead-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(0.65rem, 1.2vw, 0.8rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .masthead-price {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      font-weight: 300;
      color: var(--grey);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 5vw, 4rem);
      gap: clamp(2rem, 5vw, 5rem);
    }

    .headline-col {
      display: flex;
      flex-direction: column;
      gap: clamp(1.2rem, 2vw, 2rem);
    }

    .kicker {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: rise 0.6s ease forwards 0.8s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.03em;
      opacity: 0;
      animation: rise 1s cubic-bezier(0.2, 0, 0, 1) forwards 1s;
    }

    .lede {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.78rem, 1.2vw, 0.88rem);
      font-weight: 300;
      line-height: 1.7;
      color: var(--grey);
      max-width: 30ch;
      opacity: 0;
      animation: rise 0.6s ease forwards 1.6s;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      opacity: 0;
      animation: rise 0.6s ease forwards 2s;
      transition: background 0.2s ease;
      width: fit-content;
    }

    .cta:hover { background: var(--accent); }

    /* Right col — large display number, editorial feel */
    .display-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      border-left: 1px solid var(--border);
      padding-left: clamp(1.5rem, 3vw, 3rem);
      opacity: 0;
      animation: rise 1s ease forwards 1.4s;
    }

    .display-num {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(5rem, 15vw, 13rem);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.06em;
      color: var(--border);
    }

    .display-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.58rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--grey);
      text-align: right;
    }

    /* Footer rule */
    .footer {
      border-top: 1px solid var(--border);
      padding: clamp(0.6rem, 1.5vw, 1rem) clamp(1.5rem, 5vw, 4rem);
      display: flex;
      justify-content: space-between;
      opacity: 0;
      animation: rise 0.5s ease forwards 2.4s;
    }

    .footer-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grey);
    }

    @media (max-width: 600px) {
      .content { grid-template-columns: 1fr; }
      .display-col { display: none; }
    }

  /* ---- meme ---- */
  @keyframes fade-img { from { opacity: 0 } to { opacity: 1 } }
  .meme-corner { position: fixed; bottom: clamp(2.5rem, 5vw, 4rem); right: clamp(2rem, 5vw, 4rem); width: clamp(110px, 16vw, 150px); z-index: 10; pointer-events: none; opacity: 0; animation: fade-img 0.8s ease forwards 3s; }
  .meme-corner svg { width: 100%; height: auto; display: block; border: 1px solid #DDDDD8; }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <span class="masthead-date">Est. 2025</span>

      <!-- member.eguia.me -->
      <span class="masthead-title">Member Name — member.eguia.me</span>
      <!-- eguia.me:
      <span class="masthead-title">The Eguia Family — eguia.me</span>
      -->

      <span class="masthead-price">Site in progress</span>
    </header>

    <main class="content">
      <div class="headline-col">
        <span class="kicker">Construction notice</span>

        <!-- member.eguia.me -->
        <h1>Member<br>Eguia</h1>
        <!-- eguia.me:
        <h1>The<br>Eguia<br>Family</h1>
        -->

        <!-- member.eguia.me -->
        <p class="lede">This space is being built. Come back soon — something good is on the way.</p>
        <!-- eguia.me:
        <p class="lede">Coming together. The family is building something here.</p>
        -->

        <a class="cta" href="mailto:member@eguia.me" aria-label="Send email">Contact</a>
      </div>

      <div class="display-col" aria-hidden="true">
        <span class="display-num">25</span>
        <span class="display-label">2025</span>
      </div>
    </main>

    <footer class="footer">
      <!-- member.eguia.me -->
      <span class="footer-text">© 2025 Member Name</span>
      <!-- eguia.me:
      <span class="footer-text">© 2025 Eguia</span>
      -->
      <span class="footer-text">All rights reserved</span>
    </footer>
  </div>
  <div class="meme-corner" aria-hidden="true"><svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="7" width="110" height="80" fill="#E8E7E4" rx="1" transform="rotate(-2 62 47)"/><rect x="5" y="4" width="110" height="80" fill="#F8F7F4" rx="1"/><line x1="10" y1="21" x2="110" y2="21" stroke="#0D0D0D" stroke-width="2.5"/><line x1="10" y1="25" x2="110" y2="25" stroke="#0D0D0D" stroke-width="0.7"/><text x="60" y="17" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#0D0D0D" font-weight="bold" letter-spacing="3">THE DAILY</text><text x="12" y="36" font-family="sans-serif" font-size="5" fill="#FF3F1F" letter-spacing="1" font-weight="bold">BREAKING</text><text x="12" y="50" font-family="Georgia,serif" font-size="11" fill="#0D0D0D" font-weight="bold">WEBSITE</text><text x="12" y="63" font-family="Georgia,serif" font-size="11" fill="#0D0D0D" font-weight="bold">STILL NOT</text><text x="12" y="76" font-family="Georgia,serif" font-size="11" fill="#0D0D0D" font-weight="bold">READY</text><line x1="80" y1="30" x2="80" y2="82" stroke="#DDDDD8" stroke-width="0.7"/><line x1="85" y1="38" x2="112" y2="38" stroke="#CCC" stroke-width="2"/><line x1="85" y1="44" x2="112" y2="44" stroke="#CCC" stroke-width="2"/><line x1="85" y1="50" x2="104" y2="50" stroke="#CCC" stroke-width="2"/></svg></div>
</body>
</html>
