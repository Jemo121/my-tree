<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    DOMAIN VARIANTS — change the two marked blocks to switch
    Active: member.eguia.me
  -->

  <!-- member.eguia.me --> <title>Member Name</title>
  <!-- eguia.me: <title>Eguia</title> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,200;1,200&family=Noto+Sans:wght@300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white:   #FAFAF8;
      --black:   #1A1A1A;
      --grey:    #888888;
      --rule:    #DCDCD8;
      --ink-red: #C0392B;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--white);
      color: var(--black);
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-columns: 1px 1fr;
      grid-template-rows: 1fr auto;
    }

    /* Left vertical rule — hairline, draws in top to bottom */
    .v-rule {
      grid-column: 1;
      grid-row: 1 / -1;
      background: var(--rule);
      margin-left: clamp(2.5rem, 7vw, 5rem);
      height: 0;
      align-self: start;
      animation: rule-draw 2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.3s;
    }

    @keyframes rule-draw {
      to { height: 100vh; }
    }

    .content {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 6vw, 5rem) clamp(2rem, 6vw, 5rem) clamp(2rem, 6vw, 5rem) clamp(2rem, 5vw, 4rem);
      gap: clamp(1.4rem, 2.5vw, 2.2rem);
      max-width: 640px;
    }

    /* Red seal / hanko */
    .hanko {
      width: clamp(28px, 4vw, 38px);
      height: clamp(28px, 4vw, 38px);
      opacity: 0;
      animation: seal-in 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) forwards 0.8s;
    }

    @keyframes seal-in {
      from { opacity: 0; transform: scale(1.3); }
      to   { opacity: 1; transform: scale(1); }
    }

    .eyebrow {
      font-family: 'Noto Sans', sans-serif;
      font-size: clamp(0.58rem, 0.9vw, 0.65rem);
      font-weight: 300;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--grey);
      opacity: 0;
      animation: fade-in 1s ease forwards 1.2s;
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    h1 {
      font-family: 'Noto Serif Display', Georgia, serif;
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 200;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--black);
      opacity: 0;
      animation: emerge 1.8s cubic-bezier(0.2, 0, 0, 1) forwards 1.4s;
    }

    @keyframes emerge {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Horizontal hairline rule */
    .h-rule {
      height: 1px;
      background: var(--rule);
      width: 0;
      animation: h-draw 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 2s;
    }

    @keyframes h-draw {
      to { width: min(280px, 55vw); }
    }

    .subline {
      font-family: 'Noto Sans', sans-serif;
      font-size: clamp(0.72rem, 1.1vw, 0.8rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--grey);
      line-height: 2;
      max-width: 30ch;
      opacity: 0;
      animation: fade-in 1s ease forwards 2.4s;
    }

    .cta {
      display: inline-block;
      font-family: 'Noto Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 3px;
      opacity: 0;
      animation: fade-in 1s ease forwards 2.8s;
      transition: border-color 0.3s ease, color 0.3s ease;
      width: fit-content;
    }

    .cta:hover {
      border-color: var(--black);
      color: var(--black);
    }

    .footer {
      grid-column: 2;
      grid-row: 2;
      padding: clamp(1rem, 2vw, 1.5rem) clamp(2rem, 5vw, 4rem);
      display: flex;
      justify-content: space-between;
      opacity: 0;
      animation: fade-in 1s ease forwards 3s;
    }

    .footer-text {
      font-family: 'Noto Sans', sans-serif;
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rule);
    }

    @media (max-width: 480px) {
      .page { grid-template-columns: 1fr; }
      .v-rule { display: none; }
      .content { grid-column: 1; padding: 2rem; }
      .footer { grid-column: 1; }
    }

  /* ---- pro ---- */
  @keyframes fade-img { from { opacity: 0 } to { opacity: 1 } }
  .accent-img { position: fixed; bottom: clamp(2.5rem, 5vw, 4rem); right: clamp(2rem, 5vw, 4rem); width: clamp(100px, 14vw, 150px); z-index: 2; pointer-events: none; margin: 0; opacity: 0; animation: fade-img 2s ease forwards 3.5s; }
  .accent-img img { width: 100%; display: block; filter: grayscale(0.9) sepia(0.05) brightness(0.95) contrast(0.95); }
  </style>
</head>
<body>
  <div class="page">
    <div class="v-rule" aria-hidden="true"></div>

    <div class="content">
      <!-- Red hanko seal -->
      <svg class="hanko" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="36" height="36" rx="2" fill="none" stroke="#C0392B" stroke-width="1.5"/>
        <rect x="4" y="4" width="30" height="30" rx="1" fill="none" stroke="#C0392B" stroke-width="0.5" opacity="0.5"/>
        <text x="19" y="24" text-anchor="middle" font-family="serif" font-size="15" fill="#C0392B" letter-spacing="-1">EE</text>
      </svg>

      <span class="eyebrow">In preparation</span>

      <!-- member.eguia.me -->
      <h1>Member<br>Eguia</h1>
      <!-- eguia.me:
      <h1>The Eguia<br>Family</h1>
      -->

      <div class="h-rule" aria-hidden="true"></div>

      <!-- member.eguia.me -->
      <p class="subline">This space is being prepared.<br>Something thoughtful is coming.</p>
      <!-- eguia.me:
      <p class="subline">The family, coming together.</p>
      -->

      <a class="cta" href="mailto:member@eguia.me" aria-label="Send email">Write to me</a>
    </div>

    <footer class="footer">
      <!-- member.eguia.me -->
      <span class="footer-text">© 2025 Member Name</span>
      <!-- eguia.me:
      <span class="footer-text">© 2025 Eguia</span>
      -->
      <span class="footer-text">member.eguia.me</span>
    </footer>
  </div>
  <figure class="accent-img" aria-hidden="true"><img src="https://picsum.photos/seed/zen9/280/200" alt="" loading="lazy"></figure>
</body>
</html>
