<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    DOMAIN VARIANTS — change the two marked blocks to switch
    Active: member.eguia.me
  -->

  <!-- member.eguia.me --> <title>Member Name</title>
  <!-- eguia.me: <title>Eguia</title> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black:   #050507;
      --surface: #0E0E12;
      --border:  rgba(255,255,255,0.07);
      --muted:   #555568;
      --light:   #C8C8E0;
      --g1:      #A855F7;
      --g2:      #06B6D4;
      --g3:      #F59E0B;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--light);
    }

    /* Radial glow background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 70% 50%, rgba(168,85,247,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 30% 60%, rgba(6,182,212,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: grid-in 2s ease forwards 0.5s;
    }

    @keyframes grid-in {
      to { opacity: 1; }
    }

    .page {
      position: relative;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2rem, 6vw, 5rem);
      z-index: 1;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.4rem, 2.2vw, 2rem);
      max-width: 700px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.3rem 0.8rem;
      border-radius: 100px;
      width: fit-content;
      opacity: 0;
      animation: fade-up 0.7s ease forwards 0.6s;
    }

    .tag::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--g1);
      animation: tag-pulse 2s ease-in-out infinite 1.5s;
    }

    @keyframes tag-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(3.2rem, 9vw, 7.5rem);
      font-weight: 200;
      line-height: 0.95;
      letter-spacing: -0.04em;
      opacity: 0;
      animation: fade-up 1.2s cubic-bezier(0.2, 0, 0, 1) forwards 0.9s;
    }

    /* Gradient on name */
    h1 .grad {
      background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 55%, var(--g3) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    .subline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.78rem, 1.2vw, 0.9rem);
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 36ch;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 1.6s;
    }

    /* Gradient border card */
    .card {
      position: relative;
      width: fit-content;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 2s;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      border-radius: 4px;
      z-index: 0;
      opacity: 0.6;
    }

    .cta {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--light);
      text-decoration: none;
      background: var(--surface);
      padding: 0.6rem 1.4rem;
      border-radius: 3px;
      transition: background 0.2s ease;
    }

    .cta:hover {
      background: rgba(14,14,18,0.6);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 2.3s;
    }

    .footer-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Animated gradient line */
    .gradient-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--g1), var(--g2), var(--g3), transparent);
      background-size: 200% 100%;
      animation: shift-gradient 4s linear infinite 2.5s;
      opacity: 0.4;
      width: 0;
    }

    @keyframes shift-gradient {
      0%   { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    /* Draw the line first, then animate gradient */
    .gradient-line {
      animation:
        line-draw 1s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.4s,
        shift-gradient 4s linear infinite 2.5s;
    }

    @keyframes line-draw {
      from { width: 0; opacity: 0; }
      to   { width: min(320px, 60vw); opacity: 0.4; }
    }

    @media (max-width: 480px) {
      .page { padding: 2rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content">
      <span class="tag">In progress</span>

      <!-- member.eguia.me -->
      <h1>Member<br><span class="grad">Eguia</span></h1>
      <!-- eguia.me:
      <h1>The<br><span class="grad">Eguia</span><br>Family</h1>
      -->

      <div class="gradient-line" aria-hidden="true"></div>

      <!-- member.eguia.me -->
      <p class="subline">This space is being built.<br>Come back soon.</p>
      <!-- eguia.me:
      <p class="subline">The family is coming together.<br>Back soon.</p>
      -->

      <div class="card">
        <a class="cta" href="mailto:member@eguia.me" aria-label="Send email">Get in touch</a>
      </div>
    </div>

    <footer class="footer">
      <!-- member.eguia.me -->
      <span class="footer-text">© 2025 Member Name</span>
      <!-- eguia.me:
      <span class="footer-text">© 2025 Eguia</span>
      -->
      <span class="footer-text">member.eguia.me</span>
    </footer>
  </div>
</body>
</html>
