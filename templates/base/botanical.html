<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    DOMAIN VARIANTS — change the two marked blocks to switch
    Active: member.eguia.me
  -->

  <!-- member.eguia.me --> <title>Member Name</title>
  <!-- eguia.me: <title>Eguia</title> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper:    #F5F0E8;
      --sage:     #7A9E7E;
      --deep:     #3D5C41;
      --earth:    #8B6F47;
      --mist:     #B8CAB9;
      --text:     #2C3A2D;
      --light:    #A5BCA7;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--text);
    }

    /* Organic dot texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle, rgba(122,158,126,0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0;
      animation: texture-in 2s ease forwards 0.4s;
    }

    @keyframes texture-in {
      to { opacity: 1; }
    }

    /* Botanical leaf SVG — pure CSS, decorative right side */
    .leaf {
      position: fixed;
      right: -4vw;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(180px, 30vw, 380px);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      animation: leaf-in 2.5s cubic-bezier(0.2, 0, 0, 1) forwards 0.8s;
    }

    @keyframes leaf-in {
      from { opacity: 0; transform: translateY(-50%) translateX(30px) rotate(-3deg); }
      to   { opacity: 0.18; transform: translateY(-50%) translateX(0) rotate(0deg); }
    }

    .page {
      position: relative;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2.5rem, 6vw, 5rem);
      z-index: 1;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.2rem, 2vw, 1.8rem);
      max-width: 560px;
    }

    /* Sprig ornament */
    .ornament {
      width: clamp(1.8rem, 3vw, 2.5rem);
      opacity: 0;
      animation: fade-up 0.8s ease forwards 0.6s;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: clamp(0.6rem, 1vw, 0.68rem);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sage);
      opacity: 0;
      animation: fade-up 0.8s ease forwards 0.9s;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--text);
      opacity: 0;
      animation: fade-up 1.2s cubic-bezier(0.2, 0, 0, 1) forwards 1.1s;
    }

    h1 em {
      font-style: italic;
      color: var(--deep);
    }

    /* Botanical rule with leaf caps */
    .floral-rule {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 1.6s;
    }

    .floral-rule::before,
    .floral-rule::after {
      content: '✦';
      font-size: 0.4rem;
      color: var(--sage);
    }

    .floral-rule-line {
      flex: 1;
      max-width: 120px;
      height: 1px;
      background: linear-gradient(90deg, var(--mist), var(--sage), var(--mist));
    }

    .subline {
      font-family: 'Jost', sans-serif;
      font-size: clamp(0.78rem, 1.2vw, 0.88rem);
      font-weight: 300;
      line-height: 1.85;
      color: var(--earth);
      max-width: 34ch;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 1.9s;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--deep);
      text-decoration: none;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 2.2s;
      transition: color 0.25s ease;
      width: fit-content;
    }

    .cta::after {
      content: '';
      display: block;
      width: 1.6rem;
      height: 1px;
      background: var(--sage);
      transition: width 0.3s ease;
    }

    .cta:hover { color: var(--sage); }
    .cta:hover::after { width: 2.4rem; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .footer-text {
      font-family: 'Jost', sans-serif;
      font-size: 0.58rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--light);
      opacity: 0;
      animation: fade-up 0.8s ease forwards 2.5s;
    }

    @media (max-width: 480px) {
      .page { padding: 2rem; }
      .leaf { display: none; }
    }
  </style>
</head>
<body>
  <!-- Botanical SVG leaf decoration -->
  <svg class="leaf" viewBox="0 0 200 340" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M100 320 C100 320 20 220 30 140 C40 60 80 20 100 10 C120 20 160 60 170 140 C180 220 100 320 100 320Z" fill="#3D5C41" stroke="#3D5C41" stroke-width="0.5"/>
    <path d="M100 320 L100 10" stroke="#7A9E7E" stroke-width="0.8"/>
    <path d="M100 200 C100 200 60 180 45 155" stroke="#7A9E7E" stroke-width="0.5"/>
    <path d="M100 200 C100 200 140 180 155 155" stroke="#7A9E7E" stroke-width="0.5"/>

  <main class="page">
    <div class="content">
      <!-- Sprig ornament -->
      <svg class="ornament" viewBox="0 0 40 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20 26 L20 2" stroke="#7A9E7E" stroke-width="0.8"/>
        <path d="M20 18 C20 18 10 14 6 8" stroke="#7A9E7E" stroke-width="0.7"/>
        <path d="M20 18 C20 18 30 14 34 8" stroke="#7A9E7E" stroke-width="0.7"/>
        <path d="M20 10 C20 10 12 7 9 3" stroke="#7A9E7E" stroke-width="0.6"/>
        <path d="M20 10 C20 10 28 7 31 3" stroke="#7A9E7E" stroke-width="0.6"/>
      </svg>

      <span class="eyebrow">Growing slowly</span>

      <!-- member.eguia.me -->
      <h1>Member<br><em>Eguia</em></h1>
      <!-- eguia.me:
      <h1>The <em>Eguia</em><br>Family</h1>
      -->

      <div class="floral-rule" aria-hidden="true">
        <div class="floral-rule-line"></div>
      </div>

      <!-- member.eguia.me -->
      <p class="subline">This space is being built.<br>Something good is coming.</p>
      <!-- eguia.me:
      <p class="subline">Coming together, in time.</p>
      -->

      <a class="cta" href="mailto:member@eguia.me" aria-label="Send email">Say hello</a>
    </div>

    <footer class="footer">
      <!-- member.eguia.me -->
      <span class="footer-text">© 2025 Member Name</span>
      <!-- eguia.me:
      <span class="footer-text">© 2025 Eguia</span>
      -->
      <span class="footer-text">member.eguia.me</span>
    </footer>
  </main>
</body>
</html>
