name = "my-tree-ackerman"
compatibility_date = "2026-11-22"

[vars]
ENVIRONMENT = "production"

[assets]
directory = "public/"
not_found_handling = "404-page"

[previews.vars]
ENVIRONMENT = "preview"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 0.25
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.25
persist = true

[observability.issue_detection]
enabled = true
